name: Build TikTok Q

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK URL or APKCombo page for an original universal TikTok APK"
        required: true
        default: "https://apkcombo.com/tiktok-videos-shop-live/com.zhiliaoapp.musically/download/apk"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download original TikTok APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          mkdir -p build/input
          if [[ "$APK_URL" == https://apkcombo.com/* ]]; then
            curl --fail --location --retry 3 --retry-delay 5 \
              --user-agent "TikTok-Q-GitHub-Action/1.0" \
              "$APK_URL" --output /tmp/apkcombo.html
            APK_URL="$(python3 - <<'PY'
          import html
          import re
          from urllib.parse import parse_qs, unquote, urljoin, urlparse

          page = open('/tmp/apkcombo.html', encoding='utf-8').read()
          for href in re.findall(r'href="([^"]*?/r2\?u=[^"]+)"', page):
              href = html.unescape(href)
              target = parse_qs(urlparse(urljoin('https://apkcombo.com', href)).query).get('u', [''])[0]
              target = unquote(target)
              if '.apk?' in target.lower() or target.lower().endswith('.apk'):
                  print(target)
                  break
          else:
              raise SystemExit('Could not find a signed APK URL in APKCombo page')
          PY
            )"
          fi
          test -n "$APK_URL"
          curl --fail --location --retry 3 --retry-delay 5 \
            --user-agent "TikTok-Q-GitHub-Action/1.0" \
            "$APK_URL" --output build/input/tiktok-original.apk
          file build/input/tiktok-original.apk
          unzip -tq build/input/tiktok-original.apk

      - name: Build TikTok Q
        run: |
          chmod +x build.sh
          ./build.sh build/input/tiktok-original.apk --out build/tiktok-q.apk

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-q-apk
          path: build/tiktok-q.apk
          if-no-files-found: error
