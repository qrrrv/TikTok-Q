name: Build TikTok Q

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct APK URL or page for the original TikTok 47.1.4 universal APK"
        required: true
        default: "https://apkcombo.com/tiktok-videos-shop-live/com.zhiliaoapp.musically/download/apk"
        type: string

# Do not let repeated manual dispatches race while downloading a 300–450 MB APK.
concurrency:
  group: tiktok-q-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Download original TikTok APK
        env:
          APK_URL: ${{ inputs.apk_url || 'https://apkcombo.com/tiktok-videos-shop-live/com.zhiliaoapp.musically/download/apk' }}
        run: |
          mkdir -p build/input
          if [[ "$APK_URL" == https://apkcombo.com/* ]]; then
            # Large APK downloads sometimes end with an HTTP/2 INTERNAL_ERROR.
            # HTTP/1.1 plus retry-all-errors makes the download recoverable.
            curl --fail --location --http1.1 \
              --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 1800 \
              --connect-timeout 30 --max-time 1800 \
              --user-agent "TikTok-Q-GitHub-Action/1.0" \
              "$APK_URL" --output /tmp/apkcombo.html
            APK_URL="$(python3 - <<'PY'
          import html
          import re
          from urllib.parse import unquote

          page = open('/tmp/apkcombo.html', encoding='utf-8').read()
          for href in re.findall(r'href="([^"]*?/r2\?u=[^"]+)"', page):
              href = html.unescape(href)
              target = unquote(href.split('?u=', 1)[1])
              if '.apk?' in target.lower() or target.lower().endswith('.apk'):
                  print(target)
                  break
          else:
              raise SystemExit('Could not find a signed APK URL in APKCombo page')
          PY
            )"
          fi
          test -n "$APK_URL"
          curl --fail --location --http1.1 \
            --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 1800 \
            --connect-timeout 30 --max-time 1800 \
            --user-agent "TikTok-Q-GitHub-Action/1.0" \
            "$APK_URL" --output build/input/tiktok-original.apk
          file build/input/tiktok-original.apk
          unzip -tq build/input/tiktok-original.apk

      - name: Build TikTok Q
        run: |
          chmod +x build.sh
          ./build.sh build/input/tiktok-original.apk --out build/tiktok-q.apk

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-q-apk
          path: build/tiktok-q.apk
          if-no-files-found: error
